; ============================================================
;  MINI CONSOLA DE VIDEOJUEGOS - ESP32-S3
;  Archivo de configuración de PlatformIO
; ============================================================

; ------------------------------------------------------------
;  CONFIGURACIÓN COMÚN (la usan los dos entornos)
; ------------------------------------------------------------
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Velocidad del monitor serie (para ver mensajes de prueba)
monitor_speed = 115200

; Bibliotecas que PlatformIO descarga automáticamente
lib_deps =
    ; Base gráfica: texto, líneas, rectángulos, etc.
    adafruit/Adafruit GFX Library@^1
    ; Pantalla real: TFT 1,8" ST7735
    adafruit/Adafruit ST7735 and ST7789 Library@^1
    ; Pantalla de Wokwi: ILI9341 (Wokwi no tiene la ST7735)
    adafruit/Adafruit ILI9341@^1

; ------------------------------------------------------------
;  ENTORNO 1: PLACA FÍSICA (ESP32-S3 DevKitC-1 N16R8)
;  16 MB de flash + 8 MB de PSRAM
; ------------------------------------------------------------
[env:fisico]
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM

; ------------------------------------------------------------
;  ENTORNO 2: SIMULACIÓN EN WOKWI
;  Le avisa al código que está en el simulador
; ------------------------------------------------------------
[env:simulacion]
build_flags =
    -D MODO_SIMULACION